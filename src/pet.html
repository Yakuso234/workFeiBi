<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>workFeiBi</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <main id="petRoot" class="pet-root" title="拖动菲比；单击互动；双击设置；右键菜单">
    <section id="bubble" class="bubble hidden">
      <strong id="bubbleTitle">专注时间</strong>
      <span id="bubbleText">25:00</span>
      <small id="bubbleHint">单击菲比确认</small>
    </section>
    <div id="timerBadge" class="timer-badge">25:00</div>
    <button id="settingsButton" aria-label="打开设置">⚙</button>
    <div id="petStage" class="pet-stage idle">
      <img id="petImage" src="../assets/images/phoebe_1.png" draggable="false" alt="菲比啾比桌宠" />
      <span id="emotion" class="emotion" aria-hidden="true"></span>
      <span class="shadow"></span>
    </div>
  </main>
  <script src="pet.js"></script>
</body>
</html>
